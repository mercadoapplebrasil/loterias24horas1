<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 664 300">
  <style>
.sx-lg,.sx-tf,.sx-tb,.sx-rabo{transform-box:fill-box}
.sx-lg{transform-origin:50% 0}
.sx-a{animation:sx-pa .6s ease-in-out infinite}
.sx-b{animation:sx-pa .6s ease-in-out infinite reverse}
.sx-rabo{transform-origin:100% 100%;animation:sx-rabo .5s ease-in-out infinite alternate}
.sx-corpo{animation:sx-bob .3s ease-in-out infinite alternate}
.sx-tf,.sx-tb{transform-origin:50% 50%}
.sx-tb{transform:scaleX(0)}
.sx-tf{animation:sx-tf 7s ease-in-out infinite}
.sx-tb{animation:sx-tb 7s ease-in-out infinite}
.sx-pisca{animation:sx-pisca .45s steps(1) infinite}
@keyframes sx-pa{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-14deg)}}
@keyframes sx-rabo{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
@keyframes sx-bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes sx-tf{0%,42%{transform:scaleX(1)}48%,94%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes sx-tb{0%,48%{transform:scaleX(0)}54%,88%{transform:scaleX(1)}94%,100%{transform:scaleX(0)}}
@keyframes sx-pisca{0%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.sx-a,.sx-b,.sx-rabo,.sx-corpo,.sx-tf,.sx-tb,.sx-pisca{animation:none}}
</style>
  <ellipse cx="270" cy="282" rx="230" ry="10" fill="#C9E6D0"/>
  <g class="sx-corpo">
  <!-- rabo -->
  <path class="sx-rabo" d="M74 150c-30-10-44-40-40-70" fill="none" stroke="#6B3A1C" stroke-width="16" stroke-linecap="round"/>
  <!-- patas de trás (fundo) -->
  <g class="sx-lg sx-a"><rect x="104" y="196" width="26" height="70" rx="12" fill="#5A2F16"/><ellipse cx="117" cy="264" rx="18" ry="8" fill="#A8692F"/></g>
  <g class="sx-lg sx-b"><rect x="356" y="196" width="26" height="70" rx="12" fill="#5A2F16"/><ellipse cx="369" cy="264" rx="18" ry="8" fill="#A8692F"/></g>
  <!-- corpo comprido -->
  <rect x="64" y="118" width="350" height="100" rx="50" fill="#7A4422"/>
  <!-- barriga clara -->
  <path d="M110 206c80 16 200 16 280 0v8c-80 18-200 18-280 0z" fill="#C8843F"/>
  <!-- patas da frente -->
  <g class="sx-lg sx-b"><rect x="128" y="196" width="28" height="74" rx="13" fill="#7A4422"/><ellipse cx="142" cy="268" rx="22" ry="10" fill="#C8843F"/></g>
  <g class="sx-lg sx-a"><rect x="380" y="196" width="28" height="74" rx="13" fill="#7A4422"/><ellipse cx="394" cy="268" rx="22" ry="10" fill="#C8843F"/></g>
  <!-- pescoço -->
  <path d="M370 150c10-40 40-62 70-62l20 60c-30 10-56 34-70 66z" fill="#7A4422"/>
  <!-- bandana -->
  <path d="M378 150c26-22 54-30 86-26l6 22c-34-2-62 8-84 28z" fill="#0E7A3E"/>
  <path d="M420 136l14 46 22-42c-12-4-24-6-36-4z" fill="#0B5F31"/>
  <circle cx="436" cy="176" r="15" fill="#F5C842" stroke="#C99A12" stroke-width="3"/>
  <text x="436" y="182" font-family="Outfit, Inter, Arial, sans-serif" font-weight="800" font-size="15" text-anchor="middle" fill="#0B3D24">24</text>
  <!-- cabeça -->
  <ellipse cx="456" cy="84" rx="48" ry="42" fill="#7A4422"/>
  <!-- focinho comprido -->
  <path d="M478 58c30 4 58 18 70 34 4 6 0 14-8 16-26 6-52 8-78 2z" fill="#7A4422"/>
  <path d="M480 96c22 6 44 6 62 2-14 12-38 16-62 8z" fill="#C8843F"/>
  <circle cx="546" cy="88" r="11" fill="#2B1A0E"/>
  <!-- orelha caída -->
  <path d="M430 60c-24 4-34 40-26 80 4 18 22 22 32 8 10-20 12-56 6-80z" fill="#9A5A2C"/>
  <!-- olho e sobrancelha -->
  <ellipse cx="478" cy="72" rx="8" ry="9" fill="#2B1A0E"/><circle cx="481" cy="69" r="3" fill="#fff"/>
  <path d="M468 56c8-6 18-6 24 0" fill="none" stroke="#C8843F" stroke-width="5" stroke-linecap="round"/>
  <!-- bilhete na boca -->
  <g transform="translate(86 -10) rotate(10 430 104)">
    <g class="sx-tf">
    <rect x="430" y="104" width="128" height="78" rx="8" fill="#fff" stroke="#0B5F31" stroke-width="4"/>
    <rect x="430" y="104" width="128" height="26" rx="8" fill="#0E7A3E"/>
    <rect x="430" y="120" width="128" height="10" fill="#0E7A3E"/>
    <text x="494" y="123" font-family="Outfit, Inter, Arial, sans-serif" font-weight="800" font-size="15" text-anchor="middle" fill="#fff">MEGA-SENA</text>
    <g stroke="#0E7A3E" stroke-width="2"><circle cx="447" cy="148" r="9" fill="#E3F3E6"/><circle cx="466" cy="148" r="9" fill="#E3F3E6"/><circle cx="485" cy="148" r="9" fill="#E3F3E6"/><circle cx="504" cy="148" r="9" fill="#E3F3E6"/><circle cx="523" cy="148" r="9" fill="#E3F3E6"/><circle cx="542" cy="148" r="9" fill="#E3F3E6"/></g>
    <g font-family="Outfit, Inter, Arial, sans-serif" font-weight="800" font-size="9.5" text-anchor="middle" fill="#0B3D24"><text x="447" y="151.5">07</text><text x="466" y="151.5">13</text><text x="485" y="151.5">24</text><text x="504" y="151.5">33</text><text x="523" y="151.5">41</text><text x="542" y="151.5">58</text></g>
    <path d="M448 168h70M448 174h46" stroke="#BFE0C8" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g class="sx-tb">
      <rect x="430" y="104" width="128" height="78" rx="8" fill="#F5C842" stroke="#C99A12" stroke-width="4"/>
      <rect x="430" y="104" width="128" height="26" rx="8" fill="#0E7A3E"/>
      <rect x="430" y="120" width="128" height="10" fill="#0E7A3E"/>
      <text x="494" y="123" font-family="Outfit, Inter, Arial, sans-serif" font-weight="800" font-size="15" text-anchor="middle" fill="#fff">MEGA-SENA</text>
      <g class="sx-pisca">
        <text x="494" y="164" font-family="Outfit, Inter, Arial, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#0B3D24">PREMIADO!</text>
        <path d="M440 140l3 6 6 1-5 4 1 6-5-3-5 3 1-6-5-4 6-1zM548 162l2 4 4 1-3 3 1 4-4-2-4 2 1-4-3-3 4-1z" fill="#fff"/>
      </g>
    </g>
    </g>
  <!-- boca segurando (por cima do bilhete) -->
  <path d="M486 104c10 5 22 6 34 4" fill="none" stroke="#5A2F16" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
